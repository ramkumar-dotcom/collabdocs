# Collab socket service on Railway (not the Next.js app — that stays on Vercel).

[build]
builder = "NIXPACKS"
buildCommand = "npm ci"
watchPatterns = ["server/**", "package.json", "package-lock.json", "nixpacks.toml"]

[deploy]
startCommand = "npm run start:socket"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
