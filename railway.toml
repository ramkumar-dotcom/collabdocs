# Collab socket service on Railway (Next.js stays on Vercel).
# Do NOT set buildCommand to "npm ci" — Nixpacks already installs deps.
# A second npm ci fights the node_modules cache mount (EBUSY).

[build]
builder = "NIXPACKS"
# No-op build: socket server is plain TypeScript run via tsx (no next build).
buildCommand = "echo 'socket service: skip compile'"
watchPatterns = ["server/**", "package.json", "package-lock.json", "nixpacks.toml"]

[deploy]
startCommand = "npm run start:socket"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
