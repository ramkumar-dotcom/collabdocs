# Force Node 20 on Railway (default was 18, which breaks Next/mongoose engines).
# This service only runs the Socket.IO collab server — not `next build`.

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Vercel builds the Next app; Railway only needs node_modules for the socket server.
cmds = ["echo 'Skipping next build (socket service)'"]

[start]
cmd = "npm run start:socket"
