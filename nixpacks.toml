# Socket-only service: Node 20, install once, no Next.js build.

[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.install]
cmds = ["npm ci --omit=dev"]

[phases.build]
# Intentionally empty work — avoid a second npm ci (EBUSY on cache mounts).
cmds = ["echo 'Skipping next build (socket service only)'"]

[start]
cmd = "npm run start:socket"
